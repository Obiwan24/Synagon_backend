spring:
  application:
    name: synagon_backend

  datasource:
    url: jdbc:postgresql://localhost:5432/synagon_db
    username: synagon_admin
    password: synagon_secret_2026
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
